name: Browser Game Verification

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - run: npm run verify
      - name: Build itch.io zip (index.html at zip root, size and file count)
        run: npm run build:itch
      - uses: actions/upload-artifact@v4
        with:
          name: itch-zip
          path: itch/*.zip
          retention-days: 7
      - run: node scripts/hub-smoke.mjs
      - run: npm run test:mobile
